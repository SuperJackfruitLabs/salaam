name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run verify:pi
      - run: npm run demo:session
      - run: npm run demo:managed
      - run: npm run demo:children
